<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>بيتنا — منصة متابعة الطلاب</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#F2F6F4;--sf:#fff;--tx:#12302B;--mu:#5B706B;--pr:#0F6B52;--on:#fff;--go:#D9A441;--ok:#1E8E5A;--er:#C0392B;--bd:#D5E1DC;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0E1B18;--sf:#162824;--tx:#E6F1EE;--mu:#9DB5AE;--pr:#3FBF95;--on:#07241C;--ok:#4CC98F;--er:#F07B6C;--bd:#28413B}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0E1B18;--sf:#162824;--tx:#E6F1EE;--mu:#9DB5AE;--pr:#3FBF95;--on:#07241C;--ok:#4CC98F;--er:#F07B6C;--bd:#28413B}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:500 16px/1.8 Tajawal,"Segoe UI",Tahoma,sans-serif;min-height:100vh}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 16px;background:var(--sf);border-bottom:3px solid var(--go);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.logo{display:flex;align-items:center;gap:8px;font-size:24px;font-weight:800;color:var(--pr)}
.wrap{max-width:980px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:28px;margin:8px 0 2px;font-weight:800}h2{font-size:20px;margin:0 0 8px}
.mu{color:var(--mu);margin:0 0 14px}.sm2{font-size:13px;color:var(--mu)}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:16px;margin:0 0 14px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.btn{font:700 15px Tajawal,sans-serif;background:var(--pr);color:var(--on);border:0;border-radius:8px;padding:10px 18px;cursor:pointer}
.btn.s{background:transparent;color:var(--pr);border:1.5px solid var(--pr)}.btn.sm{padding:4px 12px;font-size:14px}.btn.er{color:var(--er);border-color:var(--er)}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid var(--go);outline-offset:2px}
label{display:block;font-weight:700;margin:10px 0 4px}
input,select,textarea{width:100%;font:500 16px Tajawal,sans-serif;padding:10px 12px;border:1.5px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tabs{display:flex;gap:6px;margin:10px 0 14px;overflow-x:auto}.tabs .btn{flex:1;white-space:nowrap}.tabs .btn:not(.on){background:transparent;color:var(--mu);border:1.5px solid var(--bd)}
.auth{max-width:420px;margin:24px auto}.brand{text-align:center;margin-bottom:16px}.brand b{display:block;font-size:64px;line-height:1.2;color:var(--pr);font-weight:800}
.err{color:var(--er);font-weight:700;margin:8px 0 0}
.bar{height:10px;border-radius:5px;background:var(--bd);overflow:hidden;margin:6px 0}.bar i{display:block;height:100%;background:var(--go)}
.sub{border-inline-start:6px solid var(--c)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--bd);flex-wrap:wrap}
.chip{font-size:13px;font-weight:700;padding:2px 10px;border-radius:99px;background:var(--ok);color:var(--on)}.chip.w{background:var(--er)}
.opt{display:block;width:100%;text-align:start;margin:8px 0;padding:12px 14px;font:600 16px Tajawal,sans-serif;background:var(--bg);color:var(--tx);border:1.5px solid var(--bd);border-radius:10px;cursor:pointer}
.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 22%,var(--bg))}.opt.no{border-color:var(--er);background:color-mix(in srgb,var(--er) 22%,var(--bg))}
.big{font-size:56px;font-weight:800;color:var(--pr);line-height:1.2}.body{font-size:18px;line-height:2.1}
details{margin-top:10px}summary{cursor:pointer;font-weight:700;color:var(--pr)}
@media(max-width:520px){.two{grid-template-columns:1fr}h1{font-size:24px}}
@media(prefers-reduced-motion:no-preference){.bar i{transition:width .4s}}
</style>
</head>
<body>
<div id="app"></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const TK='baytna_tk';
let tok=null,user=null,ver=0,tm,cs='';
try{tok=localStorage.getItem(TK)}catch(e){}
const blank=()=>({students:[],results:[],done:[],gr:[],hw:[],cl:[]});
let db=blank();
const uid=()=>Math.random().toString(36).slice(2,10);
async function api(p,m,b){let r;try{r=await fetch('/api/'+p,{method:m||'GET',headers:{'Content-Type':'application/json',...(tok?{Authorization:'Bearer '+tok}:{})},body:b?JSON.stringify(b):undefined})}catch(e){throw Object.assign(new Error('تعذّر الاتصال بالخادم. تحقق من الإنترنت.'),{status:0})}
 let j={};try{j=await r.json()}catch(e){}if(!r.ok)throw Object.assign(new Error(j.error||'حدث خطأ'),{status:r.status});return j}
const lbl=()=>({saving:'جارٍ الحفظ…',ok:'تم الحفظ على الخادم',err:'تعذّر الحفظ، ستتم إعادة المحاولة',conflict:'تم تحديث البيانات من جهاز آخر'}[cs]||'');
const lab=()=>{const e=$('#cs');if(e)e.textContent=lbl()};
function save(){cs='saving';lab();clearTimeout(tm);tm=setTimeout(push,600)}
async function push(){try{const r=await api('state','PUT',{v:ver,d:db});ver=r.v;cs='ok'}
 catch(e){if(e.status===409){await load();cs='conflict';render();return}if(e.status===401)return logout();cs='err';clearTimeout(tm);tm=setTimeout(push,5000)}lab()}
async function load(){const r=await api('state');db=Object.assign(blank(),r.d);ver=r.v;user=r.user}
function logout(){tok=null;user=null;db=blank();try{localStorage.removeItem(TK)}catch(e){}S.v='auth';S.tab='login';render()}
async function boot(){if(tok){try{await load();S.v='parent'}catch(e){if(e.status===401){tok=null;try{localStorage.removeItem(TK)}catch(x){}}else S.msg=e.message}}render()}

const C=['اللغة العربية','اللغة الإنجليزية','الرياضيات','التربية الإسلامية'];
const P12=[...C,'التربية الفنية','التربية البدنية'],P36=[...C,'العلوم','الدراسات الاجتماعية','التربية الفنية','التربية البدنية'];
const MD=[...C,'العلوم','الدراسات الاجتماعية','الحاسوب','التربية الفنية','التربية البدنية'];
const SC=[...C,'الفيزياء','الكيمياء','الأحياء'],SA=[...C,'التاريخ','الجغرافيا','الاقتصاد'];
const GR=[['الصف الأول','الأساس',P12],['الصف الثاني','الأساس',P12],['الصف الثالث','الأساس',P36],['الصف الرابع','الأساس',P36],['الصف الخامس','الأساس',P36],['الصف السادس','الأساس',P36],
['الصف الأول','المتوسط',MD],['الصف الثاني','المتوسط',MD],['الصف الثالث','المتوسط',MD],
['الصف الأول','الثانوي',[...C,'الفيزياء','الكيمياء','الأحياء','التاريخ','الجغرافيا','الحاسوب']],['الصف الثاني (علمي)','الثانوي',SC],['الصف الثاني (أدبي)','الثانوي',SA],['الصف الثالث (علمي)','الثانوي',SC],['الصف الثالث (أدبي)','الثانوي',SA]];
const ST=['الأساس','المتوسط','الثانوي'],gl=i=>GR[i][0]+' '+GR[i][1];
const COL=['#1B7F5C','#1D5C8A','#B7791F','#7B4B94','#C0392B','#0E7C86','#6B7A1A','#A5446B','#4A5FC1'];
const SUB=[
{id:'ar',n:'اللغة العربية',c:'#1B7F5C',L:[
{id:'ar1',t:'المبتدأ والخبر',b:'الجملة الاسمية تبدأ باسم، وتتكوّن من مبتدأ وخبر. المبتدأ هو الاسم الذي نتحدث عنه، والخبر هو ما يُتمّ معناه. مثال: «النيلُ طويلٌ»؛ فـ«النيل» مبتدأ و«طويل» خبر.',q:[
['ما المبتدأ في جملة «الخرطومُ جميلةٌ»؟',['الخرطوم','جميلة','في'],0],
['ما الخبر في جملة «الشمسُ ساطعةٌ»؟',['الشمس','الجملة كلها','ساطعة'],2],
['أي الجمل التالية جملة اسمية؟',['كتب أحمد الدرس','الطالب مجتهد','يذهب الطالب إلى المدرسة'],1]]},
{id:'ar2',t:'الفعل الماضي',b:'الفعل الماضي يدل على عمل حدث قبل زمن الكلام، مثل: كتبَ، ذهبَ، لعبَ. نقول: «ذهبَ الطالبُ إلى المدرسة».',q:[
['أي الكلمات التالية فعل ماضٍ؟',['كتب','يكتب','اكتب'],0],
['ما الفعل الماضي في «ذهبَ الطالبُ إلى المدرسة»؟',['الطالب','المدرسة','ذهب'],2],
['الفعل الماضي يدل على عمل حدث:',['الآن','قبل زمن الكلام','غدًا'],1]]}]},
{id:'ma',n:'الرياضيات',c:'#1D5C8A',L:[
{id:'m1',t:'الكسور العادية',b:'الكسر يدل على جزء من كل. في الكسر <bdi>3/4</bdi> العدد 3 هو البسط، والعدد 4 هو المقام. إذا قسّمنا رغيف الخبز إلى 4 أجزاء متساوية وأخذنا جزءًا واحدًا فقد أخذنا <bdi>1/4</bdi>.',q:[
['في الكسر <bdi>3/4</bdi> ما المقام؟',['3','4','7'],1],
['قُسمت كعكة إلى 8 أجزاء وأُكل منها جزءان. الكسر الذي يمثل المأكول:',['<bdi>2/8</bdi>','<bdi>8/2</bdi>','<bdi>6/8</bdi>'],0],
['أي الكسور التالية أكبر؟',['<bdi>1/8</bdi>','<bdi>1/4</bdi>','<bdi>1/2</bdi>'],2]]},
{id:'m2',t:'الضرب والجنيه',b:'الضرب جمع متكرر: 3 × 5 = 5 + 5 + 5 = 15. مثال: اشترى أحمد 4 أقلام، سعر القلم 50 جنيهًا، فيدفع 4 × 50 = 200 جنيه.',q:[
['ما ناتج 6 × 7؟',['42','48','36'],0],
['اشترت آية 3 كراريس، سعر الكراس 100 جنيه. كم دفعت؟',['103','300','200'],1],
['5 + 5 + 5 + 5 + 5 تساوي:',['20','30','25'],2]]}]},
{id:'sc',n:'العلوم',c:'#B7791F',L:[
{id:'s1',t:'دورة الماء',b:'تتبخر مياه النيل والأنهار والبحار بفعل حرارة الشمس، فتصعد بخارًا إلى الجو. وعندما يبرد البخار يتكاثف فيكوّن السحب، ثم تسقط الأمطار على الأرض فتسقي الزرع.',q:[
['ما سبب تبخر الماء؟',['برودة الجو','حرارة الشمس','الرياح فقط'],1],
['تحوّل البخار إلى سحب يسمى:',['التكاثف','التبخر','الهطول'],0],
['الذي يسقط من السحب هو:',['الرمال','الأحجار','الأمطار'],2]]}]},
{id:'is',n:'التربية الإسلامية',c:'#7B4B94',L:[
{id:'i1',t:'أركان الإسلام',b:'أركان الإسلام خمسة: الشهادتان، وإقام الصلاة، وإيتاء الزكاة، وصوم رمضان، وحج البيت لمن استطاع إليه سبيلًا.',q:[
['كم عدد أركان الإسلام؟',['أربعة','خمسة','ستة'],1],
['الركن الثاني من أركان الإسلام:',['الصلاة','الصوم','الحج'],0],
['نصوم في شهر:',['شعبان','شوال','رمضان'],2]]}]},
{id:'so',n:'الدراسات الاجتماعية',c:'#C0392B',L:[
{id:'g1',t:'بلادنا السودان',b:'السودان بلد في شمال شرق أفريقيا، عاصمته الخرطوم. يلتقي في الخرطوم النيل الأبيض بالنيل الأزرق فيتكوّن نهر النيل. ومن مدننا: أم درمان وبورتسودان ومدني وكسلا.',q:[
['ما عاصمة السودان؟',['الخرطوم','مدني','بورتسودان'],0],
['يلتقي النيلان الأبيض والأزرق في:',['كسلا','الخرطوم','الأبيض'],1],
['يتكوّن نهر النيل من التقاء:',['النيل الأزرق والبحر الأحمر','النيل الأبيض والعطبرة','النيل الأبيض والنيل الأزرق'],2]]}]}];

const BL=SUB.flatMap(m=>m.L.map(l=>({...l,sub:m.n,g:[2,3,4]})));
const LOGO='<svg viewBox="0 0 40 40" width="34" height="34" aria-hidden="true"><path d="M4 20 20 5l16 15z" fill="var(--go)"/><rect x="9" y="20" width="22" height="15" rx="2" fill="var(--pr)"/><rect x="17" y="26" width="6" height="9" rx="3" fill="var(--sf)"/></svg>';

let S={v:'auth',tab:'login',sid:null,t2:'sub',lid:null,qs:[],qi:0,sc:0,pick:null,ttl:'',msg:'',del:null};
const stu=id=>db.students.find(x=>x.id===id),T=l=>l.c?esc(l.t):l.t;
const lessons=s=>{const sb=GR[s.g][2];return BL.filter(l=>l.g.includes(s.g)&&sb.includes(l.sub)).concat(db.cl.filter(l=>l.g===s.g&&sb.includes(l.sub)))};
const QS=l=>l.c?l.q.map(([a,o,i])=>[esc(a),o.map(esc),i]):l.q;
const today=()=>new Date().toISOString().slice(0,10);
function stat(s){const L=lessons(s),dn=db.done.filter(d=>d.sid===s.id&&L.some(l=>l.id===d.lid)).length;
 const rs=db.results.filter(r=>r.sid===s.id),a=rs.reduce((x,r)=>x+r.s,0),n=rs.reduce((x,r)=>x+r.n,0);
 const g=db.gr.filter(r=>r.sid===s.id),gs=g.reduce((x,r)=>x+r.s,0),gm=g.reduce((x,r)=>x+r.m,0);
 const h=db.hw.filter(r=>r.sid===s.id&&!r.dn);
 return{L,dn,rs,avg:n?Math.round(100*a/n):null,sch:gm?Math.round(100*gs/gm):null,hp:h.length,ho:h.filter(r=>r.due&&r.due<today()).length}}
const opts=a=>a.map(x=>`<option>${x}</option>`).join('');

function vAuth(){const L=S.tab==='login';
 return`<div class="auth"><div class="brand">${LOGO.replace('34','64').replace('34','64')}<b>بيتنا</b><p class="mu">منصة متابعة الطلاب في المنزل: الأساس والمتوسط والثانوي</p></div>
 <div class="card"><div class="tabs"><button class="btn ${L?'on':''}" data-a="tab" data-v="login">تسجيل الدخول</button><button class="btn ${L?'':'on'}" data-a="tab" data-v="reg">حساب جديد</button></div>
 <form id="${L?'lf':'rf'}">${L?'':'<label for="n">اسم ولي الأمر</label><input id="n" name="n" required>'}
 <label for="p">رقم الهاتف</label><input id="p" name="p" type="tel" inputmode="numeric" required>
 <label for="w">كلمة المرور</label><input id="w" name="w" type="password" minlength="6" required>
 ${S.msg?`<p class="err" role="alert">${esc(S.msg)}</p>`:''}<p><button class="btn" style="width:100%">${L?'دخول':'إنشاء الحساب'}</button></p></form>
 </div></div>`}

function vParent(u){const ss=db.students;
 return`<h1>أسرة ${esc(u.name)}</h1><p class="mu">تابع دروس طلابك ودرجاتهم وواجباتهم من مكان واحد.</p>
 <div class="grid">${ss.map(s=>{const t=stat(s);return`<div class="card"><h2>${esc(s.n)}</h2><p class="mu" style="margin:0">${gl(s.g)}</p>
 <p style="margin:10px 0 0">الدروس المنجزة: ${t.dn} من ${t.L.length}</p><div class="bar"><i style="width:${t.L.length?100*t.dn/t.L.length:0}%"></i></div>
 <div class="row"><span>متوسط الاختبارات في المنصة</span><b>${t.avg===null?'—':t.avg+'%'}</b></div>
 <div class="row"><span>متوسط درجات المدرسة</span><b>${t.sch===null?'—':t.sch+'%'}</b></div>
 <div class="row"><span>الواجبات المتبقية</span><b>${t.hp}${t.ho?` <span class="chip w">${t.ho} متأخر</span>`:''}</b></div>
 <p style="margin:12px 0 0;display:flex;gap:8px"><button class="btn" data-a="open" data-v="${s.id}">فتح حساب الطالب</button>
 <button class="btn s er sm" data-a="del" data-v="${s.id}">${S.del===s.id?'تأكيد الحذف':'حذف'}</button></p></div>`}).join('')||'<div class="card">لم تُضف أي طالب بعد. أضف أول طالب لتبدأ المتابعة.</div>'}</div>
 <div class="card"><h2>إضافة طالب</h2><form id="af"><div class="two"><div><label for="an">اسم الطالب</label><input id="an" name="n" required></div>
 <div><label for="ag">الصف الدراسي</label><select id="ag" name="g">${ST.map(st=>`<optgroup label="${st}">${GR.map((g,i)=>g[1]===st?`<option value="${i}">${g[0]}</option>`:'').join('')}</optgroup>`).join('')}</select></div></div>
 <p><button class="btn">إضافة الطالب</button></p></form></div><p class="sm2" id="cs" role="status">${lbl()}</p>`}

function vStudent(){const s=stu(S.sid);if(!s){S.v='parent';return''}
 return`<button class="btn s sm" data-a="home">رجوع لحساب ولي الأمر</button><h1>${esc(s.n)}</h1><p class="mu">${gl(s.g)}</p>
 <div class="tabs">${[['sub','المواد والدروس'],['gr','درجات المدرسة'],['hw','الواجبات']].map(([k,n])=>`<button class="btn ${S.t2===k?'on':''}" data-a="t2" data-v="${k}">${n}</button>`).join('')}</div>`+({sub:tSub,gr:tGr,hw:tHw}[S.t2])(s,GR[s.g][2])}

function tSub(s,subs){const t=stat(s);
 return(t.L.length?`<div class="card"><b>الدروس المنجزة: ${t.dn} من ${t.L.length}</b><div class="bar"><i style="width:${100*t.dn/t.L.length}%"></i></div></div>`:'')+
 subs.map((m,i)=>{const ls=t.L.filter(l=>l.sub===m),nq=ls.reduce((x,l)=>x+l.q.length,0);
 return`<div class="card sub" style="--c:${COL[i%COL.length]}"><h2>${m}</h2>${ls.map(l=>{const d=db.done.some(x=>x.sid===s.id&&x.lid===l.id);
 return`<div class="row"><span>${T(l)} ${d?'<span class="chip">تم</span>':''}</span><span><button class="btn sm" data-a="lesson" data-v="${l.id}">${d?'مراجعة':'ابدأ الدرس'}</button>${l.c?` <button class="btn s er sm" data-a="rm" data-v="cl:${l.id}">حذف</button>`:''}</span></div>`}).join('')||'<p class="mu">لا توجد دروس بعد. أضف أول درس لهذه المادة.</p>'}
 ${nq?`<div class="row"><b>اختبار المادة</b><button class="btn s sm" data-a="exam" data-v="${m}">ابدأ الاختبار</button></div>`:''}
 <details><summary>إضافة درس واختبار</summary><form data-f="cl"><input type="hidden" name="sub" value="${m}">
 <label>عنوان الدرس</label><input name="t" required><label>شرح الدرس</label><textarea name="b" rows="4" required></textarea>
 <label>أسئلة الاختبار (اختياري)</label><textarea name="q" rows="3" placeholder="السؤال | الخيار الأول | الخيار الثاني | الخيار الثالث | رقم الإجابة الصحيحة"></textarea>
 <p class="sm2">اكتب كل سؤال في سطر، وافصل بين أجزائه بالرمز |</p><button class="btn sm">حفظ الدرس</button></form></details></div>`}).join('')}

function tGr(s,subs){const g=db.gr.filter(r=>r.sid===s.id).sort((a,b)=>b.d>a.d?1:-1);
 return`<div class="card"><h2>تسجيل درجة جديدة</h2><form data-f="gr"><div class="two"><div><label>المادة</label><select name="sub">${opts(subs)}</select></div>
 <div><label>النوع</label><select name="k">${opts(['اختبار شهري','اختبار نصف الفصل','اختبار نهاية الفصل','واجب','مشاركة'])}</select></div>
 <div><label>الدرجة</label><input name="s" type="number" min="0" step="any" required></div><div><label>من</label><input name="m" type="number" min="1" step="any" value="100" required></div></div>
 <p><button class="btn">حفظ الدرجة</button></p></form></div>
 <div class="card"><h2>سجل الدرجات</h2>${g.map(r=>`<div class="row"><span>${esc(r.sub)} — ${esc(r.k)} <span class="sm2">${r.d}</span></span><span><b>${r.s} / ${r.m}</b> (${Math.round(100*r.s/r.m)}%) <button class="btn s er sm" data-a="rm" data-v="gr:${r.id}">حذف</button></span></div>`).join('')||'<p class="mu">لم تُسجَّل درجات بعد.</p>'}</div>`}

function tHw(s,subs){const h=db.hw.filter(r=>r.sid===s.id).sort((a,b)=>a.dn-b.dn||(a.due>b.due?1:-1));
 return`<div class="card"><h2>إضافة واجب</h2><form data-f="hw"><div class="two"><div><label>المادة</label><select name="sub">${opts(subs)}</select></div>
 <div><label>تاريخ التسليم</label><input name="due" type="date" required></div></div><label>وصف الواجب</label><input name="t" required>
 <p><button class="btn">إضافة الواجب</button></p></form></div>
 <div class="card"><h2>الواجبات</h2>${h.map(r=>`<div class="row"><span>${r.dn?'<s>':''}${esc(r.sub)}: ${esc(r.t)}${r.dn?'</s>':''} <span class="sm2">حتى ${r.due}</span> ${!r.dn&&r.due<today()?'<span class="chip w">متأخر</span>':''}</span>
 <span><button class="btn sm ${r.dn?'s':''}" data-a="tg" data-v="${r.id}">${r.dn?'إعادة فتح':'تم التسليم'}</button> <button class="btn s er sm" data-a="rm" data-v="hw:${r.id}">حذف</button></span></div>`).join('')||'<p class="mu">لا توجد واجبات.</p>'}</div>`}

function vLesson(s){const l=lessons(s).find(x=>x.id===S.lid);if(!l){S.v='student';return''}
 return`<button class="btn s sm" data-a="back">رجوع للدروس</button><div class="card"><h1>${T(l)}</h1><p class="body">${l.c?esc(l.b).replace(/\n/g,'<br>'):l.b}</p>
 ${l.q.length?`<button class="btn" data-a="quiz" data-v="${l.id}">ابدأ الاختبار القصير</button>`:`<button class="btn" data-a="fin" data-v="${l.id}">تم إنجاز الدرس</button>`}</div>`}

function vQuiz(){const q=S.qs[S.qi],ans=S.pick!==null;
 return`<div class="card"><p class="mu">${S.ttl} — السؤال ${S.qi+1} من ${S.qs.length}</p><div class="bar"><i style="width:${100*S.qi/S.qs.length}%"></i></div><h2>${q[0]}</h2>
 ${q[1].map((o,i)=>`<button class="opt ${ans?(i===q[2]?'ok':i===S.pick?'no':''):''}" data-a="ans" data-v="${i}">${o}</button>`).join('')}
 ${ans?`<p class="${S.pick===q[2]?'':'err'}" style="font-weight:700">${S.pick===q[2]?'أحسنت! إجابة صحيحة.':'الإجابة الصحيحة ظاهرة باللون الأخضر.'}</p><button class="btn" data-a="next">${S.qi+1<S.qs.length?'السؤال التالي':'إنهاء الاختبار'}</button>`:''}</div>`}

function vRes(){const p=Math.round(100*S.sc/S.qs.length);
 return`<div class="card" style="text-align:center"><p class="mu">${S.ttl}</p><div class="big">${S.sc} / ${S.qs.length}</div>
 <p class="body">${p>=80?'ممتاز! واصل التقدّم.':p>=50?'جيد، راجع الأسئلة التي أخطأت فيها.':'لا بأس، راجع الدرس وحاول مرة أخرى.'}</p><button class="btn" data-a="back">العودة للدروس</button></div>`}

function render(){const u=user;if(!u)S.v='auth';
 const hd=u?`<header class="top"><div class="logo">${LOGO}بيتنا</div><div>${esc(u.name)} <button class="btn s sm" data-a="out">خروج</button></div></header>`:'';
 const f={auth:vAuth,parent:vParent,student:vStudent,lesson:()=>vLesson(stu(S.sid)),quiz:vQuiz,res:vRes}[S.v];
 $('#app').innerHTML=hd+'<main class="wrap">'+f(u)+'</main>';window.scrollTo(0,0)}

function quizStart(ttl,qs,lid){S.qs=qs;S.ttl=ttl;S.lid=lid;S.qi=0;S.sc=0;S.pick=null;S.v='quiz'}
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,v=b.dataset.v,s=stu(S.sid);
 if(a==='tab'){S.tab=v;S.msg=''}
 else if(a==='out'){logout();return}
 else if(a==='open'){S.sid=v;S.t2='sub';S.v='student'}
 else if(a==='home'){S.v='parent'}
 else if(a==='back'){S.v='student'}
 else if(a==='t2'){S.t2=v}
 else if(a==='del'){if(S.del===v){db.students=db.students.filter(x=>x.id!==v);['results','done','gr','hw'].forEach(k=>db[k]=db[k].filter(r=>r.sid!==v));S.del=null;save()}else S.del=v}
 else if(a==='lesson'){S.lid=v;S.v='lesson'}
 else if(a==='quiz'){const l=lessons(s).find(x=>x.id===v);quizStart('اختبار: '+T(l),QS(l),v)}
 else if(a==='exam'){const L=lessons(s).filter(l=>l.sub===v);quizStart('اختبار '+v,L.flatMap(QS),null)}
 else if(a==='fin'){if(!db.done.some(x=>x.sid===s.id&&x.lid===v))db.done.push({sid:s.id,lid:v});save();S.v='student'}
 else if(a==='rm'){const[k,id]=v.split(':');db[k]=db[k].filter(r=>r.id!==id);save()}
 else if(a==='tg'){const r=db.hw.find(x=>x.id===v);r.dn=!r.dn;save()}
 else if(a==='ans'){if(S.pick!==null)return;S.pick=+v;if(S.pick===S.qs[S.qi][2])S.sc++}
 else if(a==='next'){S.qi++;S.pick=null;if(S.qi>=S.qs.length){
  db.results.push({id:uid(),sid:S.sid,t:S.ttl,s:S.sc,n:S.qs.length,d:Date.now()});
  if(S.lid&&S.sc/S.qs.length>=.5&&!db.done.some(x=>x.sid===S.sid&&x.lid===S.lid))db.done.push({sid:S.sid,lid:S.lid});
  save();S.v='res'}}
 render()});

document.addEventListener('submit',async e=>{e.preventDefault();const f=e.target,d=Object.fromEntries(new FormData(f)),s=stu(S.sid);
 if(f.id==='lf'||f.id==='rf'){const bt=f.querySelector('button.btn');bt.disabled=true;
  try{const r=await api(f.id==='lf'?'login':'register','POST',{p:d.p,w:d.w,n:d.n});tok=r.token;try{localStorage.setItem(TK,tok)}catch(x){}await load();S.msg='';S.v='parent'}
  catch(x){S.msg=x.message}}
 else if(f.id==='af'){db.students.push({id:uid(),n:d.n.trim(),g:+d.g});save()}
 else if(f.dataset.f==='cl'){const q=(d.q||'').split('\n').map(x=>x.split('|').map(y=>y.trim())).filter(p=>p.length>=4&&p[0]).map(p=>{const i=parseInt(p[p.length-1])-1,o=p.slice(1,-1);return i>=0&&i<o.length?[p[0],o,i]:null}).filter(Boolean);
  db.cl.push({id:'c'+uid(),g:s.g,sub:d.sub,t:d.t.trim(),b:d.b.trim(),q,c:1});save()}
 else if(f.dataset.f==='gr'){db.gr.push({id:uid(),sid:s.id,sub:d.sub,k:d.k,s:+d.s,m:+d.m,d:today()});save()}
 else if(f.dataset.f==='hw'){db.hw.push({id:uid(),sid:s.id,sub:d.sub,t:d.t.trim(),due:d.due,dn:false});save()}
 render()});
boot();
</script>
</body>
</html>
